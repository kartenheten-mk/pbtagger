name: CI

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.19
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check Node dependency licenses
        run: npm run licenses:node:check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  docs:
    name: Documentation checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.lock.txt

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.lock.txt

      - name: Check Python dependency licenses
        run: python scripts/check-python-licenses.py --check

      - name: Build documentation
        run: mkdocs build --strict